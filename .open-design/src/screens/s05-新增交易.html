<style data-for="s05">
/* ═══ s05 · 新增 / 编辑交易 ═══ */
.fin-tip{position:fixed;z-index:60;pointer-events:none;padding:6px 10px;border-radius:var(--radius-md);background:color-mix(in srgb,var(--fg) 92%,transparent);color:var(--bg);font-size:var(--text-sm);font-family:var(--font-mono);box-shadow:var(--elev-2);white-space:nowrap}
.s05-amount{display:flex;align-items:center;gap:var(--space-2)}
.s05-cur{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:600;color:var(--muted)}
.s05-input{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:4px 0;outline:none;font-family:var(--font-mono);font-size:var(--text-2xl);font-weight:700;letter-spacing:var(--tracking-display);color:var(--expense-text);border-radius:var(--radius-sm)}
.s05-amount.is-inc .s05-cur{color:var(--income-text)}
.s05-amount.is-inc .s05-input{color:var(--income-text)}
.s05-input:focus-visible{box-shadow:var(--focus-ring)}
.s05-input.is-bad{animation:s05-shake 320ms var(--ease-standard)}
@keyframes s05-shake{0%,100%{transform:none}18%{transform:translateX(-6px)}38%{transform:translateX(5px)}58%{transform:translateX(-3px)}78%{transform:translateX(2px)}}
.s05-note{flex:1 1 auto;min-width:0;min-height:var(--tap-min);border:0;background:transparent;padding:10px 0;outline:none;font:inherit;font-size:var(--text-base);color:var(--fg);border-radius:var(--radius-sm)}
.s05-note:focus-visible{box-shadow:var(--focus-ring)}
.s05-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.s05-cat-name{font-size:var(--text-xs);line-height:1.15;text-align:center;max-width:100%}
.s05-cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:86px;padding:var(--space-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--surface);color:var(--fg-2);font:inherit;font-size:var(--text-sm);cursor:pointer;transition:transform var(--dur-press) var(--ease-out),background var(--dur-state) var(--ease-standard),border-color var(--dur-state) var(--ease-standard)}
.s05-cat:active{transform:scale(.93)}
.s05-cat[aria-pressed="true"]{background:color-mix(in srgb,var(--fg) 7%,transparent);border-color:color-mix(in srgb,var(--fg) 26%,transparent);color:var(--fg);font-weight:600}
.s05-check{opacity:0;transition:opacity var(--dur-state) var(--ease-standard)}
.s05-check svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[data-acct][aria-pressed="true"] .s05-check{opacity:1}
.s05-dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.s05-del{display:none;color:var(--danger-text);border-color:color-mix(in srgb,var(--danger) 34%,transparent)}
.screen.is-edit .s05-del{display:inline-flex}
.s05-date-list{display:flex;flex-direction:column;gap:var(--space-2)}
.s05-in{animation:s05-in 300ms var(--ease-out) both;animation-delay:calc(var(--stagger) * var(--i,0))}
@keyframes s05-in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .s05-in,.s05-input.is-bad{animation:none!important}
}
</style>
