     一屏一个文件：样式段由组装器放进 <head>，结构段放进 <body>。
     文件内三行 od 标记（style / section / end）由组装脚本消费，
     scripts/assemble-prototype.mjs 只认独占一行的标记，请勿删除或改名。

<!-- ============================================================
     s14a · 记一笔（一屏 · 全抽屉版）
     ------------------------------------------------------------
     交互模型：四个字段行（分类 / 账户 / 时间 / 单据）**同一个模型** —— 点行弹底部抽屉。
     取这份的理由：
       · 主表单高度**恒定**，抽屉开合不影响「一屏不放滚」；
       · 分类抽屉是 4 列网格，一屏可见 12+ 个，冷门分类最多滑一下（对比 s14 的横滑一行 6 个）；
       · 账户/时间不再有「pill 组 / 单 pill / 裸文本」三种形态混用。
     ============================================================ -->
<style data-for="s14a">
  /* ── s14a：字段选择全部走底部抽屉（与分类/单据同一个模型） ── */
  .screen.s14a .content{display:flex;flex-direction:column;gap:var(--space-3);padding-bottom:0}
  .screen.s14a .s14-card{padding:var(--space-3) var(--space-4)}
  .s14a-amt{display:flex;align-items:baseline;gap:var(--space-2);padding-block:var(--space-1)}
  .s14a-cur{font-size:var(--text-xl);color:var(--muted);font-weight:600}
  .s14a-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);
    font-family:inherit;font-size:var(--text-3xl);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .s14a-kind{margin-bottom:var(--space-2)}
  .screen.s14a .s14-label{flex:0 0 44px;font-size:var(--text-sm);color:var(--muted)}
  .screen.s14a .s14-value{flex:1;min-width:0;text-align:left;color:var(--fg);font-size:var(--text-sm);font-weight:500;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .screen.s14a .s14-toggle{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:44px;
    border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0;text-align:left}
  .screen.s14a .s14-toggle:not(:first-child){border-top:1px solid var(--border-soft)}
  .screen.s14a .s14-note{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);
    font-family:inherit;font-size:var(--text-sm);font-weight:500}
  .screen.s14a .s14-receipt-text{flex:1;min-width:0;text-align:left;color:var(--fg);font-size:var(--text-sm);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .s14a-kv{display:flex;gap:var(--space-3);padding:var(--space-1) 0;font-size:var(--text-sm)}
  .s14a-kv > span:first-child{flex:0 0 64px;color:var(--muted)}
  .s14a-kv > span:last-child{flex:1;min-width:0;color:var(--fg);word-break:break-all}
  .s14a-actions{position:sticky;bottom:0;margin-top:auto;padding:var(--space-3) var(--space-4) var(--space-5);
    background:linear-gradient(to top,var(--surface) 62%,transparent)}
  /* 抽屉内：分类网格 4 列（一屏可见 12+，冷门不用长滑） */
  .s14a-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);max-height:46vh;overflow-y:auto}
  .s14a-grid .s14-cat{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);
    border:0;background:transparent;padding:0;font:inherit;color:var(--muted);cursor:pointer}
  .s14a-grid .s14-cat .cat-icon{width:44px;height:44px}
  .s14a-grid .s14-cat[aria-pressed="true"]{color:var(--accent-text)}
  .s14a-grid .s14-cat[aria-pressed="true"] .cat-icon{outline:2px solid var(--accent);outline-offset:2px}
  .s14a-grid .s14-cat-name{font-size:var(--text-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  /* 抽屉内：横向条（只用于日期快捷） */
  .s14a-strip{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-2);scrollbar-width:none}
  .s14a-strip::-webkit-scrollbar{display:none}
  .s14a-strip .chip{flex:0 0 auto;min-width:48px;justify-content:center}
  /* 时刻：滚轮（比一排圆 chip 紧凑得多，也不用横着划去找数字） */
  /* ⚠️ flex 容器必须显式 width:100% —— 默认按内容宽度收缩，justify-content:center 就没有可居中的余地，
     表现出来就是「滚轮组没居中」。 */
  .s14a-timepick{display:flex;align-items:center;justify-content:center;gap:var(--space-3);
    margin:var(--space-4) 0 0}
  .s14a-wheel-wrap{position:relative;flex:0 0 auto;width:104px;height:132px;border-radius:var(--radius-md);overflow:hidden;
    background:color-mix(in srgb, var(--fg) 4%, transparent)}
  .s14a-wheel-band{position:absolute;left:6px;right:6px;top:44px;height:44px;border-radius:var(--radius-sm);
    background:color-mix(in srgb, var(--fg) 8%, transparent);pointer-events:none}
  .s14a-wheel{position:relative;height:100%;padding:44px 0;overflow-y:auto;scroll-snap-type:y mandatory;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .s14a-wheel::-webkit-scrollbar{display:none}
  .s14a-wheel button{display:block;width:100%;height:44px;scroll-snap-align:center;border:0;background:transparent;
    font:inherit;font-size:var(--text-lg);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;
    transition:color var(--dur-fast, .15s) ease}
  .s14a-wheel button.is-on{color:var(--fg);font-weight:600}
  .s14a-colon{font-size:var(--text-xl);color:var(--muted);font-weight:600;padding-bottom:2px}
  .s14a-picked{margin:var(--space-3) 0 0;text-align:center;color:var(--muted);font-size:var(--text-sm)}
  /* ⚠️ min-width:0 是横向滚动的前提：flex 子项默认按内容宽度扩张，
     会把抽屉整个撑宽、溢出手机框（真机表现就是「超出屏幕」）。
     strip 必须能收缩，横向滚动才成立。 */
  .s14a-line{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;min-width:0}
  .s14a-line > .s14a-key{flex:0 0 44px;color:var(--muted);font-size:var(--text-sm)}
  .s14a-line > .s14a-strip{flex:1 1 auto;min-width:0}
  /* 抽屉宽度锁死在手机框内。
     外壳的 .scrim.is-bottom 是 grid + place-items:end center，隐式列的 auto 最小尺寸 = item 的
     min-content，于是抽屉被内容撑到 476px（手机框只有 393px），右侧整块溢出屏幕 ——
     max-width 也压不住 min-content。这里在 s14a 内改成 flex：stretch 语义明确，不再按内容 sizing。 */
  .screen.s14a .scrim.is-bottom{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
  .screen.s14a .scrim{overflow:hidden}
  .screen.s14a .sheet{width:100%;max-width:100%}
</style>

  <script>
  /* s14a：字段行 → 抽屉；抽屉内选中 → 回写该行的值。全部只在本屏内生效。 */
  (function () {
    var sec = document.querySelector('.screen.s14a');
    if (!sec) return;
    var each = Array.prototype.forEach;

    /* 点抽屉外的遮罩即关闭。外壳只绑了 data-close 按钮，没绑遮罩本身 ——
       点别处就是在说「我不要选了」，这是最基本的人性化。 */
    each.call(sec.querySelectorAll('.scrim'), function (sc) {
      sc.addEventListener('click', function (e) {
        if (e.target === sc) window.App.close('#' + sc.id);
      });
    });

    each.call(sec.querySelectorAll('[data-sheet]'), function (b) {
      b.addEventListener('click', function () {
        window.App.open(b.getAttribute('data-sheet'));
      });
    });

    /* 分类 / 账户：点一下即选中 → 回写值 + 自动收起抽屉（选完不该再让用户点一次关闭） */
    each.call(sec.querySelectorAll('[data-pick="cat"], [data-pick="acct"]'), function (group) {
      group.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var key = group.getAttribute('data-pick');
        setValue(key, b.getAttribute('data-value') || (b.textContent || '').trim());
        each.call(group.querySelectorAll('button'), function (x) {
          x.setAttribute('aria-pressed', String(x === b));
          x.classList.toggle('is-on', x === b);
        });
        var sheet = group.closest('.scrim');
        if (sheet) window.App.close('#' + sheet.id);
      });
    });

    /* 日期快捷：点一下换日期；时刻由下面的滚轮决定（时间抽屉保持打开，等「确定」） */
    each.call(sec.querySelectorAll('[data-pick="date"]'), function (group) {
      group.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        sec.dataset.dateLabel = b.getAttribute('data-value') || (b.textContent || '').trim();
        each.call(group.querySelectorAll('button'), function (x) {
          x.setAttribute('aria-pressed', String(x === b));
          x.classList.toggle('is-on', x === b);
        });
        syncWheels();
      });
    });

    /* 时刻滚轮：滚到哪一格就算选中哪一格。
       相比「一排圆 chip 横着划」，滚轮一格一屏能看 3 个数字、且手指不用来回横移。 */
    function wheelText(name, fallback) {
      var w = sec.querySelector('[data-wheel="' + name + '"]');
      if (!w) return fallback;
      var items = w.querySelectorAll('button');
      var idx = Math.round(w.scrollTop / 44);
      idx = Math.max(0, Math.min(items.length - 1, idx));
      return items[idx] ? items[idx].textContent.trim() : fallback;
    }

    function syncWheels() {
      each.call(sec.querySelectorAll('[data-wheel]'), function (w) {
        var items = w.querySelectorAll('button');
        var idx = Math.round(w.scrollTop / 44);
        each.call(items, function (x, i) { x.classList.toggle('is-on', i === idx); });
      });
      var text = (sec.dataset.dateLabel || '今天') + ' ' +
        wheelText('hour', '10') + ':' + wheelText('minute', '30') + ':00';
      setValue('time', text);
      var picked = sec.querySelector('[data-od-id="s14a-picked"]');
      if (picked) picked.textContent = text;
    }

    each.call(sec.querySelectorAll('[data-wheel]'), function (w) {
      var timer;
      w.addEventListener('scroll', function () {
        clearTimeout(timer);
        timer = setTimeout(syncWheels, 80);   // 滚停再算，别每像素都刷新
      });
    });

    /* 对齐必须在抽屉**可见之后**做：hidden 状态下 scrollTop 赋值无效，
       表现出来就是滚轮停在 00/01/02、选中的 10:30 没落在中间高亮带上。 */
    function alignWheels() {
      each.call(sec.querySelectorAll('[data-wheel]'), function (w) {
        var items = w.querySelectorAll('button');
        each.call(items, function (x, i) { if (x.classList.contains('is-on')) w.scrollTop = i * 44; });
      });
      syncWheels();
    }
    each.call(sec.querySelectorAll('[data-sheet="#s14a-time-sheet"]'), function (b) {
      b.addEventListener('click', function () {
        // 抽屉带展开动画；动画期间 scroll-snap 会把滚动位置吸回 0，
        // 所以动画前对齐一次、结束后再兜一次（实测只设一次会被吸回去）。
        setTimeout(alignWheels, 120);
        setTimeout(alignWheels, 460);
      });
    });

    function setValue(key, text) {
      var el = sec.querySelector('[data-value-for="' + key + '"]');
      if (el) el.textContent = text;
    }
  })();
  </script>
