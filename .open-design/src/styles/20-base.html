<style>
/* ═══ 0 · 基线 ═══════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background:var(--page-bg);
  color:var(--fg);
  font-family:var(--font-body);
  font-size:var(--text-sm);
  line-height:var(--leading-body);
  -webkit-font-smoothing:antialiased;
  display:grid;
  place-items:center;
  padding:var(--space-6) var(--space-4);
  transition:background var(--dur-state) var(--ease-standard);
}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.switch:focus-visible,
.theme-opt:focus-visible,.segmented>:focus-visible,.icon-btn:focus-visible{
  outline:0;box-shadow:var(--focus-ring)
}

/* ═══ 1 · 原型页 + Android Pixel 设备框 ═════════════════════════════ */
.od-stage{display:flex;justify-content:center;align-items:flex-start}
.device-frame{
  position:relative;
  padding:12px;
  border-radius:48px;
  background:linear-gradient(155deg,var(--frame-a) 0%,var(--frame-b) 58%,var(--frame-a) 100%);
  box-shadow:
    0 0 0 1px var(--frame-edge) inset,
    0 0 0 4px var(--frame-inner) inset,
    0 30px 64px -20px var(--frame-shadow);
}
.dev-key{position:absolute;width:3px;border-radius:2px;background:var(--frame-key)}
.k-assist{left:-3px;top:132px;height:34px}
.k-volup{left:-3px;top:196px;height:64px}
.k-voldn{left:-3px;top:272px;height:64px}
.k-power{right:-3px;top:224px;height:104px}
.device{
  position:relative;
  width:var(--screen-w);
  height:var(--screen-h);
  border-radius:36px;
  overflow:hidden;
  background:var(--app-bg);
  isolation:isolate;
  transition:transform var(--dur-press) var(--ease-out),box-shadow var(--dur-state) var(--ease-standard);
}
.device.is-haptic-light{transform:scale(0.996)}
.device.is-haptic-medium{transform:scale(0.991)}
.punch{
  position:absolute;left:50%;top:11px;z-index:60;
  width:13px;height:13px;transform:translateX(-50%);
  border-radius:50%;background:var(--punch);
  box-shadow:0 0 0 1px var(--punch-ring) inset;
}
.haptic-ping{
  position:absolute;left:50%;bottom:calc(var(--tab-h) + var(--gesture-h) + var(--space-6));
  z-index:35;width:22px;height:22px;margin-left:-11px;border-radius:50%;
  background:color-mix(in srgb,var(--fg) 14%,transparent);opacity:0;pointer-events:none;
}
.haptic-ping.is-on{animation:od-ping var(--dur-page) var(--ease-out) both}

/* ── 屏幕容器 ─────────────────────────────────────────────────────── */
.device-screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.app-backdrop{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 62% at 50% -8%,var(--backdrop-a) 0%,var(--backdrop-b) 52%,var(--app-bg) 100%);
}

/* ═══ 2 · Android 系统栏 / 应用栏 / Tab 条 / 手势条 ═════════════════ */
.statusbar{
  position:relative;z-index:2;flex:0 0 auto;height:var(--statusbar-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-4);
  color:var(--fg);font-size:13px;font-weight:600;letter-spacing:.01em;
}
.statusbar .sb-time{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sb-icons{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.sb-icons svg{display:block;fill:currentColor}
.sb-icons .sb-outline{fill:none;stroke:currentColor;stroke-opacity:.45}
.sb-icons .sb-dim{fill-opacity:.45}

.appbar{
  position:relative;z-index:2;flex:0 0 auto;height:var(--appbar-h);
  display:none;align-items:center;gap:var(--space-2);
  padding:0 var(--space-3) 0 var(--space-2);
}
.device-screen.is-push .appbar{display:flex}
.appbar-title{
  font-size:var(--text-base);font-weight:600;letter-spacing:-0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.icon-btn{
  width:var(--icon-size);height:var(--icon-size);min-height:var(--icon-size);flex:0 0 auto;
  display:grid;place-items:center;
  border:1px solid var(--border-soft);border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--fg) 5%,transparent);
  color:var(--fg);cursor:pointer;padding:0;
  transition:background var(--dur-press) var(--ease-out),transform var(--dur-press) var(--ease-out);
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.screen-host{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:1}
#screenHost > .screen{
  position:absolute;inset:0;display:none;flex-direction:column;min-height:0;background:transparent;
}
#screenHost > .screen.is-active{display:flex;transition:opacity var(--dur-page) var(--ease-standard),transform var(--dur-page) var(--ease-standard)}
#screenHost > .screen.is-entering{opacity:0;transform:translate3d(var(--space-4),0,0)}
#screenHost > .screen.is-leaving{
  opacity:0;transform:translate3d(calc(var(--space-3) * -1),0,0);pointer-events:none;
  transition:opacity var(--dur-page) var(--ease-standard),transform var(--dur-page) var(--ease-standard);
}

.tabbar{
  position:absolute;left:0;right:0;bottom:var(--gesture-h);z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:var(--space-1) var(--space-1) 0;
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--border-soft);
}
.tab{
  appearance:none;border:0;background:transparent;color:var(--muted);
  min-height:48px;padding:0 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:inherit;font-size:var(--text-xs);letter-spacing:.02em;cursor:pointer;
  border-radius:var(--radius-md);
  transition:color var(--dur-state) var(--ease-standard);
}
.tab-icon{
  display:grid;place-items:center;width:56px;height:28px;border-radius:var(--radius-pill);
  transition:background var(--dur-state) var(--ease-standard),transform var(--dur-press) var(--ease-out);
}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .tab-icon{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tab:active .tab-icon{transform:scale(.92)}
.gesture-bar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:var(--gesture-h);display:grid;place-items:center}
.gesture-bar::after{
  content:"";width:108px;height:4px;border-radius:var(--radius-pill);
  background:var(--fg);opacity:.32;
}
.toast-host{
  position:absolute;left:0;right:0;z-index:30;
  bottom:calc(var(--tab-h) + var(--gesture-h) + var(--space-4));
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  pointer-events:none;
}

/* ═══ 3 · 屏内排版与布局助手 ════════════════════════════════════════ */
.content{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding:var(--space-2) 0 var(--space-6);
}
.content::-webkit-scrollbar{width:0;height:0}
.pad{padding-inline:var(--space-4)}
.screen-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-2) var(--space-4) var(--space-3);
}
.h1{font-size:var(--text-xl);font-weight:700;letter-spacing:var(--tracking-display);line-height:var(--leading-tight);margin:0}
.h2{font-size:var(--text-lg);font-weight:600;letter-spacing:-0.012em;line-height:var(--leading-tight);margin:0}
.h3{font-size:var(--text-base);font-weight:600;line-height:1.3;margin:0}
.meta{font-size:var(--text-sm);color:var(--muted);margin:0}
.fine{font-size:var(--text-xs);color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.mt-2{margin-top:var(--space-2)}.mt-3{margin-top:var(--space-3)}.mt-4{margin-top:var(--space-4)}.mt-5{margin-top:var(--space-5)}

/* ═══ 4 · 组件库（契约 §5，冻结类名） ══════════════════════════════ */
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-highlight),var(--elev-1);
  border-radius:var(--radius-lg);
}
.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:var(--space-4);
}
.card.glass{
  background:var(--glass-bg);border-color:var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-highlight),var(--elev-1);
}

.group{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:0 var(--space-4);overflow:hidden;
}
.group-label{
  font-size:var(--text-sm);color:var(--muted);padding:0 var(--space-4);margin:0 0 var(--space-2);
}
.group-row,.row,.list-row{
  display:flex;align-items:center;gap:var(--space-3);
  min-height:var(--row-min-h);padding:var(--space-2) 0;
  border-top:1px solid var(--border-soft);
  font-size:var(--text-base);color:var(--fg);text-align:left;
}
.group-row:first-child,.row:first-child,.list-row:first-child{border-top:0}
.row,.list-row{background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
/* button.group-row 复位：清除浏览器 UA 默认底色(浅灰，约 efefef)/边框/居中，避免 --muted 落在其上跌破 4.5:1 */
button.group-row{background:transparent;border:0;border-top:1px solid var(--border-soft);padding:var(--space-2) 0;width:100%;font:inherit;font-size:var(--text-base);color:inherit;text-align:left;cursor:pointer}
button.row,button.list-row,a.row,a.list-row{font:inherit;font-size:var(--text-base);cursor:pointer}
.list-row{min-height:48px;font-size:var(--text-sm)}
.row-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:var(--text-base);font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:var(--text-sm);color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-tail{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:var(--space-2);color:var(--muted);font-size:var(--text-sm)}
.row-icon{
  flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;
  border-radius:var(--radius-md);
  /* 默认中性（功能类图标）；带分类色 --k 时用该色的淡底 + 深描边（事件/分类类图标） */
  background:color-mix(in srgb,var(--k,var(--fg)) 12%,transparent);
  color:color-mix(in srgb,var(--k,var(--fg-2)) 78%,var(--fg));
}
.row-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chev{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.5}

.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap-min);padding:0 var(--space-3);
  border:1px solid var(--border);border-radius:var(--radius-pill);
  background:transparent;color:var(--fg-2);
  font:inherit;font-size:var(--text-sm);white-space:nowrap;cursor:pointer;
  transition:background var(--dur-state) var(--ease-standard),border-color var(--dur-state) var(--ease-standard),color var(--dur-state) var(--ease-standard),transform var(--dur-press) var(--ease-out);
}
.chip:active{transform:scale(.96)}
.chip.is-on,.chip[aria-pressed="true"]{
  background:color-mix(in srgb,var(--fg) 7%,transparent);
  border-color:color-mix(in srgb,var(--fg) 24%,transparent);
  color:var(--fg);font-weight:600;
}

.segmented{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;
  padding:4px;border:1px solid var(--border-soft);border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--fg) 5%,transparent);
}
.segmented > *{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap-min);padding:0 var(--space-3);
  border:0;border-radius:var(--radius-pill);background:transparent;color:var(--muted);
  font:inherit;font-size:var(--text-sm);cursor:pointer;white-space:nowrap;
  transition:background var(--dur-state) var(--ease-standard),color var(--dur-state) var(--ease-standard);
}
.segmented > .is-on,.segmented > [aria-pressed="true"],.segmented > [aria-selected="true"]{
  background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--elev-1);
}

.kpi{
  display:flex;flex-direction:column;gap:2px;min-width:0;
  padding:var(--space-3);
  background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);
}
.kpi-label{font-size:var(--text-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:var(--text-xl);font-weight:700;letter-spacing:var(--tracking-display);line-height:1.1;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-unit{font-size:var(--text-sm);font-weight:500;color:var(--muted);margin-left:4px}
.kpi-delta{font-size:var(--text-sm);color:var(--muted);white-space:nowrap}
.kpi-delta.is-up{color:var(--income-text)}
.kpi-delta.is-down{color:var(--expense-text)}
.kpi-spark{width:100%;height:var(--spark-h);margin-top:var(--space-1)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  min-height:48px;padding:0 var(--space-5);
  border:1px solid transparent;border-radius:var(--radius-md);
  background:var(--accent);color:var(--accent-on);
  font:inherit;font-size:var(--text-base);font-weight:600;cursor:pointer;
  transition:background var(--dur-state) var(--ease-standard),transform var(--dur-press) var(--ease-out),opacity var(--dur-state) var(--ease-standard);
}
.btn:active{transform:scale(.96)}
.btn:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.45;cursor:default}
.btn-block{width:100%}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--border)}
.btn-ghost:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}

.switch{
  position:relative;display:inline-flex;align-items:center;
  width:var(--switch-w);min-height:var(--tap-min);padding:0;
  border:0;background:transparent;cursor:pointer;
}
.switch::before{
  content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:var(--switch-track-w);height:var(--switch-track-h);border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--fg) 16%,transparent);
  transition:background var(--dur-state) var(--ease-standard);
}
.switch::after{
  content:"";position:absolute;left:6px;top:50%;margin-top:calc(var(--knob-size) / -2);
  width:var(--knob-size);height:var(--knob-size);border-radius:50%;
  background:var(--surface-warm);box-shadow:var(--elev-1);
  transition:transform var(--dur-state) var(--ease-spring);
}
.switch[aria-checked="true"]::before{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.fab{
  position:absolute;right:var(--space-4);bottom:var(--space-4);z-index:6;
  width:var(--fab-size);height:var(--fab-size);
  display:grid;place-items:center;padding:0;
  border:0;border-radius:var(--radius-lg);
  background:var(--accent);color:var(--accent-on);
  box-shadow:var(--elev-2);cursor:pointer;
  transition:transform var(--dur-press) var(--ease-out);
}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tl{list-style:none;margin:0;padding:0}
.tl-item{
  position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);
  gap:var(--space-3);padding:var(--space-2) 0;
}
.tl-item::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;background:var(--border-soft)}
.tl-item:first-child::before{top:14px}
.tl-item:last-child::before{bottom:calc(100% - 22px)}
.tl-item::after{
  content:"";position:absolute;left:calc(52px - (var(--dot-size) - 1px) / 2);top:14px;
  width:var(--dot-size);height:var(--dot-size);border-radius:50%;
  background:var(--fg-2);box-shadow:0 0 0 3px var(--app-bg);
}
/* 带应用图标的变体（广告跳过记录这类「主体是应用」的列表）：用应用图标替代时间线圆点 */
.tl-item.has-icon{grid-template-columns:46px 30px minmax(0,1fr);gap:var(--space-2);align-items:start}
.tl-item.has-icon::before,
.tl-item.has-icon::after{display:none}
.tl-item.has-icon .tl-body{padding-left:0}

/* 应用图标：原型以「品牌色 + 应用首字」呈现；
   实现侧优先取 PackageManager 的真实图标，取不到时回落到本形态（--app 缺省即中性底色）。 */
.app-icon{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--app,var(--fg-2));color:#fff;font-size:13px;font-weight:600;line-height:1;
  overflow:hidden;
}
.app-icon img{width:100%;height:100%;object-fit:cover;display:block}

.tl-time{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--muted);padding-top:2px}
.tl-body{min-width:0;padding-left:var(--space-3);display:flex;flex-direction:column;gap:2px}
.tl-title{font-size:var(--text-base);line-height:1.3}
.tl-sub{font-size:var(--text-sm);color:var(--muted);line-height:1.3}

.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2);min-width:0}
.legend li{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);min-width:0}
.legend .legend-num{margin-left:auto;color:var(--muted);font-family:var(--font-mono)}
.legend-dot{flex:0 0 auto;width:10px;height:10px;border-radius:3px;background:var(--k,var(--chart-8))}

.scrim{
  position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:var(--scrim);padding:var(--space-4);
  animation:od-fade var(--dur-overlay-in) var(--ease-standard) both;
}
.scrim.is-bottom{place-items:end center;padding:0}
.dialog{
  width:100%;max-width:320px;padding:var(--space-5);
  background:var(--surface-warm);border-radius:var(--radius-lg);box-shadow:var(--elev-3);
  animation:od-pop var(--dur-overlay-in) var(--ease-spring) both;
}
.sheet{
  width:100%;padding:var(--space-4) var(--space-4) var(--space-6);
  background:var(--surface-warm);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow:var(--elev-3);
  animation:od-sheet var(--dur-overlay-in) var(--ease-standard) both;
}
.sheet-grip{width:36px;height:4px;border-radius:var(--radius-pill);background:var(--border);margin:0 auto var(--space-3)}
.toast{
  max-width:280px;padding:10px var(--space-4);
  border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--fg) 90%,transparent);
  color:var(--bg);font-size:var(--text-sm);box-shadow:var(--elev-2);
  animation:od-toast-in var(--dur-overlay-in) var(--ease-standard) both;
}
.toast.is-out{animation:od-toast-out var(--dur-overlay-out) var(--ease-in) both}

/* ── 五态块（契约 §8） ───────────────────────────────────────────── */
.st-loading,.st-empty,.st-error,.st-edge{

   子元素会按 max-content 收缩（实测最宽子元素只剩 34px）。
   这里在基类收口：网格形态下子项拉满宽度、顶部对齐 —— 新屏直接用 .st-loading 不再复发。
   .st-empty / .st-error / .st-edge 的居中语义不在此处改动。 */

  display:block;padding:var(--space-4);
  justify-items:stretch;align-items:start;
