<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记一笔 · A/B 两版对照</title>
<style>
  :root{
    --bg:#f5f5f7; --surface:#fff; --fg:#1d1d1f; --muted:#6e6e73;
    --border:#d2d2d7; --accent:#0071e3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{padding:22px 28px 4px}
  h1{margin:0 0 6px;font-size:22px;font-weight:600}
  .lead{margin:0;color:var(--muted);font-size:14px}
  .lead em{color:var(--fg);font-style:normal;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 28px 32px}
  figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column}
  figcaption{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  figcaption .tag{font-weight:400;font-size:13px;color:var(--muted)}
  iframe{width:100%;height:880px;border:0;background:var(--bg)}
  .diff{padding:12px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);margin:0}
  .diff b{color:var(--fg);font-weight:600}
  @media (max-width:1120px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>记一笔 · A/B 两版对照</h1>
  <p class="lead">两边都能真点。打开即停在<em>「分类已展开」</em>的状态 —— 差异直接摆在眼前。先点「分类」看两边怎么给选择，再<em>点一下空白处</em>看能不能收起来。</p>
</header>
<div class="grid">
  <figure>
    <figcaption>A 版 · 全抽屉 <span class="tag">分类/账户/时间/单据 同一模型</span></figcaption>
    <iframe src="26-a-quan-chouti.html" title="A 版 · 全抽屉"></iframe>
    <p class="diff"><b>分类</b>弹抽屉，一屏摆出 20 个 · <b>主表单高度恒定</b>，开抽屉时不滚 · <b>账户</b>是带余额的列表 · 点遮罩即关</p>
  </figure>
  <figure>
    <figcaption>B 版 · 内联展开 <span class="tag">分类/账户就地展，时间/单据走抽屉</span></figcaption>
    <iframe src="26-b-neilian-zhankai.html" title="B 版 · 内联展开"></iframe>
    <p class="diff"><b>分类</b>就地展开 8 个 + 「更多」· <b>展开时主表单被顶下去</b>（850 &gt; 738，要滚）· <b>账户</b>是内联 chips · 点遮罩即关</p>
  </figure>
</div>
</body>
</html>
