<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行为记录 · C2 时间切片 · 开屏动效</title>
<style>
:root{
  /* 唯一颜色落点：其余位置一律 var() / currentColor */
  --ink:#0E1218; --ink-3:#6B7484; --paper:#FFFFFF;
  --surf:#F4F6F9; --surf-2:#E6EAF1; --hair:#DDE3EB;
  --accent:#1D6E9E; --accent-2:#63D8FF;
  --splash-bg:#0E1218;
  --skel:#E6EAF1; --skel-2:#EFF2F6;
  --shadow:rgba(14,18,24,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surf-2);color:var(--ink);font:15px/1.7 var(--font);-webkit-font-smoothing:antialiased}
.page{display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 20px 60px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h1 span{display:block;font-size:14px;font-weight:400;color:var(--ink-3);margin-top:6px;letter-spacing:.02em}
/* ---------- 手机框 ---------- */
.phone{position:relative;width:393px;height:852px;border-radius:46px;overflow:hidden;background:var(--surf);
  box-shadow:0 30px 70px var(--shadow);border:1px solid var(--hair)}
.phone::after{content:"";position:absolute;left:50%;bottom:9px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.25;z-index:5}
/* ---------- 冷启动黑场层 ---------- */
.veil{position:absolute;inset:0;z-index:4;background:var(--splash-bg);display:flex;align-items:center;justify-content:center;opacity:0;
  animation:veil 1.8s linear both}
.veil-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
.splash-mark{display:block;color:var(--paper);fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.splash-mark .sm-bar{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center bottom;
  animation:barGrow .38s cubic-bezier(.22,.85,.3,1) both}
.splash-mark .sm-ring{transform-box:fill-box;transform-origin:center;animation:ringIn .30s ease-out both}
.splash-mark .sm-bead{fill:var(--accent-2);stroke:none;transform-box:fill-box;transform-origin:center;
  animation:beadDrop .44s cubic-bezier(.2,1.3,.4,1) both}
.splash-mark .sm-pulse{fill:none;stroke:var(--accent-2);stroke-width:6;transform-box:fill-box;transform-origin:center;
  animation:pulse .72s ease-out both}
.sm-b2{animation-delay:.10s}
.sm-b1{animation-delay:.20s}
.sm-b3{animation-delay:.28s}
.sm-ring{animation-delay:.40s}
.sm-bead{animation-delay:.62s}
.sm-pulse{animation-delay:.86s}
.splash-word{color:var(--paper);font-size:24px;font-weight:600;letter-spacing:.12em;line-height:1;
  animation:up .34s cubic-bezier(.22,.85,.3,1) both;animation-delay:.86s}
/* ---------- 首页骨架层 ---------- */
.app{position:absolute;inset:0;z-index:3;background:var(--surf);display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 6px;font-size:14px;color:var(--ink);font-weight:600}
.sbar i{font-style:normal;letter-spacing:2px;opacity:.45}
.app-body{flex:1;padding:14px 20px 0;display:flex;flex-direction:column;gap:14px}
.sk{border-radius:16px;background:var(--skel);animation:up .46s cubic-bezier(.22,.85,.3,1) both}
.sk-hero{height:186px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--hair)}
.sk-hero .ring{width:118px;height:118px;border-radius:50%;border:14px solid var(--skel)}
.sk-row{height:66px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--paper);border:1px solid var(--hair)}
.sk-row b{display:block;width:38px;height:38px;border-radius:11px;background:var(--skel-2);border:1px solid var(--hair)}
.sk-row u{display:block;height:11px;border-radius:6px;background:var(--skel);text-decoration:none}
.sk-row u.l{width:46%}
.sk-row u.s{width:26%;background:var(--skel-2)}
.sk-line{height:15px;border-radius:8px;background:var(--skel);width:34%;margin:2px 0 0}
.tabbar{height:78px;border-top:1px solid var(--hair);background:var(--paper);display:flex;align-items:center;justify-content:space-around;padding-bottom:12px}
.tabbar span{width:44px;height:44px;border-radius:50%;background:var(--skel)}
.tabbar span.on{background:var(--accent);opacity:.85}
.d1{animation-delay:1.50s}.d2{animation-delay:1.60s}.d3{animation-delay:1.70s}.d4{animation-delay:1.80s}
.d5{animation-delay:1.88s}.d6{animation-delay:1.96s}.d7{animation-delay:2.04s}
/* ---------- 关键帧：只动 transform / opacity ---------- */
@keyframes veil{0%,68%{opacity:1}100%{opacity:0}}
@keyframes barGrow{from{transform:scaleY(0);opacity:.35}to{transform:scaleY(1);opacity:1}}
@keyframes ringIn{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes beadDrop{0%{transform:translateY(-22px) scale(.45);opacity:0}
  62%{transform:translateY(0) scale(1.16);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(2.5);opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ---------- 重播 ---------- */
.replay{min-height:48px;min-width:132px;padding:0 26px;border-radius:14px;border:1px solid var(--hair);background:var(--paper);
  color:var(--ink);font:600 15px/1 var(--font);cursor:pointer}
.replay:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:14px;color:var(--ink-3);margin:0;text-align:center;max-width:520px}
/* ---------- 兜底：用户要求减弱动效时直接给终态 ---------- */
@media (prefers-reduced-motion: reduce){
  .veil,.splash-mark .sm-bar,.splash-mark .sm-ring,.splash-mark .sm-bead,.splash-mark .sm-pulse,.splash-word,.sk{
    animation:none!important;opacity:1!important;transform:none!important}
  .veil,.splash-mark .sm-pulse{opacity:0!important}
}
</style>
</head>
<body>
<div class="page">
  <h1>行为记录 · C2 时间切片 · 开屏动效<span>393 × 852 · 冷启动黑场 → mark 入场 → 字标上浮 → 首页骨架错落浮现</span></h1>
  <div class="phone" id="phone">
    <!-- 首页骨架层（浅色，终态） -->
    <div class="app">
      <div class="sbar"><span>9:41</span><i>·····</i></div>
      <div class="app-body">
        <div class="sk sk-line d1"></div>
        <div class="sk sk-hero d2"><div class="ring"></div></div>
        <div class="sk sk-row d3"><b></b><u class="l"></u></div>
        <div class="sk sk-row d4"><b></b><u class="s"></u></div>
        <div class="sk sk-row d5"><b></b><u class="l"></u></div>
        <div class="sk sk-row d6"><b></b><u class="s"></u></div>
      </div>
      <div class="tabbar d7"><span class="on"></span><span></span><span></span><span></span></div>
    </div>
    <!-- 冷启动黑场层 -->
    <div class="veil">
      <div class="veil-inner">
        <svg class="splash-mark" viewBox="0 0 256 256" width="140" height="140" role="img" aria-label="行为记录">
          <circle class="sm-ring" cx="128" cy="128" r="100"/>
          <rect class="sm-bar sm-b1" x="76.5" y="96.5" width="15" height="87" rx="7.5"/>
          <rect class="sm-bar sm-b2" x="120.5" y="56.5" width="15" height="127" rx="7.5"/>
          <rect class="sm-bar sm-b3" x="164.5" y="112.5" width="15" height="71" rx="7.5"/>
          <circle class="sm-pulse" cx="199" cy="57" r="17"/>
          <circle class="sm-bead" cx="199" cy="57" r="17"/>
        </svg>
        <div class="splash-word">行为记录</div>
      </div>
    </div>
  </div>
  <button class="replay" id="replay" type="button">重播动效</button>
  <p class="hint">动效只改 transform / opacity；重音落在「此刻」那颗珠子：三根强度柱错落生长 → 环浮现 → 珠子落位并炸出一圈脉冲 → 字标上浮 → 黑场淡出、首页骨架错落浮现。系统开启「减弱动效」时直接呈现终态。</p>
</div>
<script>
(function(){
  var phone = document.getElementById('phone');
  var btn = document.getElementById('replay');
  // 重新插入节点才会重启 CSS 动画（remove/add class 不会）
  btn.addEventListener('click', function(){
    ['.veil', '.app'].forEach(function(sel){
      var el = phone.querySelector(sel);
      phone.replaceChild(el.cloneNode(true), el);
    });
  });
})();
</script>
</body>
</html>
