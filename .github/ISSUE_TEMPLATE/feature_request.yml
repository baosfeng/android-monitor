name: 功能建议
description: 提出一个新功能或改进想法
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景与痛点，而不只是功能名称
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法
