name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # tag 推送不触发 android-ci.yml（它的 on.push.branches 只列 main / feat/** / fix/**），
      # 所以发布链路上原本一条测试都不跑：单测全红、lint 有 error 的分支照样能打 tag 发出签名包
      # （基建审计 I6）。静态门禁是秒级的，放在装工具链之前先判，坏了不用等 20 分钟。
      - name: UI rules gate
        run: bash scripts/check-ui-rules.sh

      - name: A11y gate
        run: bash scripts/check-a11y.sh

      - name: Anchors gate
        run: node scripts/check-anchors.mjs

      - name: Docs gate
        run: node scripts/check-docs.mjs

      # tag 必须打在 main 上的提交：发版流程（scripts/release.sh）要求分支是 main，
      # 但「谁打的 tag」没人校验过。这一条把「红着也能发」的另一条路（从任意分支打 tag）也堵掉。
      - name: Assert tag sits on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "tag 必须打在 main 上的提交；${GITHUB_SHA} 不在 main 上" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "缺少 RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "解出来的 release.jks 是空文件：secret 内容不是合法 base64" >&2
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # 发布前的最低线：单测全绿 + lint 零 error/warning。覆盖率门禁不在这里重跑
      # （它要 coverageReport + 报告解析，属 CI test job 的职责），发布只兜「代码跑得起来」。
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      # 产物签名断言（基建审计 I7）：此前只 test -f 存在性，误用 debug keystore 打的包
      # 也能发成 Release。断言「APK 签名证书 == 解出来的 release keystore 证书」。
      - name: Assert APK is signed with the release keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "${APK}" ] || { echo "缺少 APK：${APK}" >&2; exit 1; }
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          [ -x "${APKSIGNER}" ] || { echo "找不到 apksigner（应位于 ${ANDROID_HOME}/build-tools/*/）" >&2; exit 1; }
          # 解析不依赖某一版 apksigner 的行首与空格：grep 关键词后统一去掉前缀 / 冒号 / 空白，
          # 并把 stderr 一起接上（新 build-tools 的 WARNING 走 stderr，证书行位置也可能变）。
          apk_cert="$("${APKSIGNER}" verify --print-certs "${APK}" 2>&1 \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "${apk_cert}" ]; then
            echo "读不到 APK 证书摘要，apksigner 原始输出（调试）：" >&2
            "${APKSIGNER}" verify --print-certs "${APK}" 2>&1 | head -30 >&2
            exit 1
          fi
          ks_cert="$(keytool -list -v -keystore "${RUNNER_TEMP}/release.jks" -storepass "${RELEASE_STORE_PASSWORD}" -alias "${RELEASE_KEY_ALIAS}" 2>/dev/null \
            | grep -i 'SHA256:' | head -1 \
            | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          [ -n "${ks_cert}" ] || { echo "读不到 keystore 里的证书摘要（密码 / alias 不对？）" >&2; exit 1; }
          if [ "${apk_cert}" != "${ks_cert}" ]; then
            echo "APK 签名证书与 release keystore 不一致：" >&2
            echo "  apk:      ${apk_cert}" >&2
            echo "  keystore: ${ks_cert}" >&2
            exit 1
          fi
          echo "签名断言通过：${apk_cert}"

      - name: Build version manifest
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s' "$PREV_TAG..HEAD" | grep -v '^- chore:' | head -20)
          else
            # 首个版本没有上一个 tag：取最近 20 个提交作为发布说明
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s' -20 | grep -v '^- chore:' | head -20)
          fi
          export APK_SHA256="$SHA256" CHANGELOG
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess

          version_file = "version.properties"
          props = dict(
              line.split("=", 1)
              for line in open(version_file, encoding="utf-8").read().splitlines()
              if "=" in line
          )
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout

          def props_of(ref):
              text = sh("git", "show", f"{ref}:version.properties")
              return dict(
                  line.split("=", 1)
                  for line in text.splitlines()
                  if "=" in line
              )

          # 最近 5 个 tag 的发布记录：每段 = 上一 tag → 该 tag 的提交。
          # 客户端拿 releases[] 里「比当前版本新」的段落，跨版本更新时按版本分段展示；
          # 顶层 changelog 仍保留最新一版，未升级的旧客户端只读它也不会坏。
          recent_tags = [t for t in sh("git", "tag", "--sort=-v:refname").split() if t][:5]
          releases = []
          for i, tag_name in enumerate(recent_tags):
              tag_props = props_of(tag_name)
              code_text = (tag_props.get("versionCode") or "").strip()
              name = (tag_props.get("versionName") or "").strip()
              if not code_text.isdigit() or not name:
                  continue
              prev = recent_tags[i + 1] if i + 1 < len(recent_tags) else None
              if prev:
                  log = sh("git", "log", "--no-merges", "--pretty=format:- %s", f"{prev}..{tag_name}")
              else:
                  log = sh("git", "log", "--no-merges", "--pretty=format:- %s", tag_name, "-20")
              lines = [l for l in log.splitlines() if not l.startswith("- chore:")][:20]
              released = sh("git", "log", "-1", "--format=%cI", tag_name).strip()
              if released:
                  released = datetime.datetime.fromisoformat(released).astimezone(
                      datetime.timezone.utc
                  ).strftime("%Y-%m-%dT%H:%M:%SZ")
              releases.append({
                  "versionCode": int(code_text),
                  "versionName": name,
                  "changelog": "\n".join(lines),
                  "publishedAt": released,
              })

          manifest = {
              "versionCode": int(props["versionCode"]),
              "versionName": props["versionName"],
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/app-release.apk",
              "apkSha256": os.environ["APK_SHA256"],
              "changelog": os.environ.get("CHANGELOG", "").strip(),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releases": releases,
          }
          with open("updates/version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cp updates/version.json "$RUNNER_TEMP/version.json"
          echo "版本清单已生成："
          cat updates/version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/version.json" \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Update version manifest on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/version.json" updates/version.json
          git add updates/version.json
          git commit -m "chore: 更新版本清单 ${GITHUB_REF_NAME}" || echo "版本清单无变化"
          git push origin main
