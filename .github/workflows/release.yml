name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # tag 推送不触发 android-ci.yml（它的 on.push.branches 只列 main / feat/** / fix/**），
      # 所以发布链路上原本一条测试都不跑：单测全红、lint 有 error 的分支照样能打 tag 发出签名包
      # （基建审计 I6）。静态门禁是秒级的，放在装工具链之前先判，坏了不用等 20 分钟。
      - name: UI rules gate
        run: bash scripts/check-ui-rules.sh

      - name: A11y gate
        run: bash scripts/check-a11y.sh

      - name: Anchors gate
        run: node scripts/check-anchors.mjs

      - name: Docs gate
        run: node scripts/check-docs.mjs

      # tag 必须打在 main 上的提交：发版流程（scripts/release.sh）要求分支是 main，
      # 但「谁打的 tag」没人校验过。这一条把「红着也能发」的另一条路（从任意分支打 tag）也堵掉。
      - name: Assert tag sits on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "tag 必须打在 main 上的提交；${GITHUB_SHA} 不在 main 上" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "缺少 RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "解出来的 release.jks 是空文件：secret 内容不是合法 base64" >&2
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # 发布前的最低线：单测全绿 + lint 零 error/warning。覆盖率门禁不在这里重跑
      # （它要 coverageReport + 报告解析，属 CI test job 的职责），发布只兜「代码跑得起来」。
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      # 产物签名断言（基建审计 I7）：此前只 test -f 存在性，误用 debug keystore 打的包
      # 也能发成 Release。断言「APK 签名证书 == 解出来的 release keystore 证书」。
      - name: Assert APK is signed with the release keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "${APK}" ] || { echo "缺少 APK：${APK}" >&2; exit 1; }
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          [ -x "${APKSIGNER}" ] || { echo "找不到 apksigner（应位于 ${ANDROID_HOME}/build-tools/*/）" >&2; exit 1; }
          apk_cert="$("${APKSIGNER}" verify --print-certs "${APK}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')"
          [ -n "${apk_cert}" ] || { echo "APK 未签名或取不到证书摘要" >&2; exit 1; }
          ks_cert="$(keytool -list -v -keystore "${RUNNER_TEMP}/release.jks" -storepass "${RELEASE_STORE_PASSWORD}" -alias "${RELEASE_KEY_ALIAS}" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          [ -n "${ks_cert}" ] || { echo "读不到 keystore 里的证书摘要（密码 / alias 不对？）" >&2; exit 1; }
          if [ "${apk_cert}" != "${ks_cert}" ]; then
            echo "APK 签名证书与 release keystore 不一致：" >&2
            echo "  apk:      ${apk_cert}" >&2
            echo "  keystore: ${ks_cert}" >&2
            exit 1
          fi
          echo "签名断言通过：${apk_cert}"

      - name: Build version manifest
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s' "$PREV_TAG..HEAD" | grep -v '^- chore:' | head -20)
          else
            # 首个版本没有上一个 tag：取最近 20 个提交作为发布说明
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s' -20 | grep -v '^- chore:' | head -20)
          fi
          export APK_SHA256="$SHA256" CHANGELOG
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re

          version_file = "version.properties"
          props = dict(
              line.split("=", 1)
              for line in open(version_file, encoding="utf-8").read().splitlines()
              if "=" in line
          )
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          manifest = {
              "versionCode": int(props["versionCode"]),
              "versionName": props["versionName"],
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/app-release.apk",
              "apkSha256": os.environ["APK_SHA256"],
              "changelog": os.environ.get("CHANGELOG", "").strip(),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("updates/version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cp updates/version.json "$RUNNER_TEMP/version.json"
          echo "版本清单已生成："
          cat updates/version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/version.json" \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Update version manifest on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/version.json" updates/version.json
          git add updates/version.json
          git commit -m "chore: 更新版本清单 ${GITHUB_REF_NAME}" || echo "版本清单无变化"
          git push origin main
