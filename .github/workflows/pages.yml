name: Deploy Prototype

on:
  push:
    branches: [ main ]
    paths:
      - '.open-design/08-prototype.html'
      - '.open-design/src/**'
      - 'scripts/assemble-prototype.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy prototype
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify prototype is in sync with src
        run: node scripts/assemble-prototype.mjs --check

      - name: Prepare site
        run: |
          mkdir -p site
          cp .open-design/08-prototype.html site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
